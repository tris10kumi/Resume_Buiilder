name: Validate and build template

on:
  push:
    branches: [main, add-ci-build, claude-workflow-and-template]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc
          pip install pyyaml weasyprint

      - name: Validate style tokens and template headings
        run: python scripts/validate_tokens.py

      - name: Build .docx and .pdf from the template
        run: |
          mkdir -p dist
          pandoc TEMPLATE_RESUME.md -o dist/TEMPLATE_RESUME.docx
          pandoc TEMPLATE_RESUME.md -s --metadata title="Resume Template" -o dist/TEMPLATE_RESUME.html
          python -m weasyprint dist/TEMPLATE_RESUME.html dist/TEMPLATE_RESUME.pdf

      - name: Upload built files
        uses: actions/upload-artifact@v4
        with:
          name: template-resume
          path: dist/
